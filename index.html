<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফ্রি ভিডিও হাব</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f0f0f; color: #fff; padding: 20px; }
        header { text-align: center; margin-bottom: 40px; padding: 20px; border-bottom: 1px solid #2f2f2f; }
        header h1 { color: #ff0000; font-size: 2.5rem; margin-bottom: 10px; }
        header p { color: #aaa; }

        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .video-card { background: #1f1f1f; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .thumbnail-container { position: relative; width: 100%; padding-top: 56.25%; background: linear-gradient(135deg, #2a2a2a, #111); }
        .thumbnail-container img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .video-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .video-title { font-size: 1.1rem; font-weight: bold; line-height: 1.4; margin-bottom: 8px; color: #f1f1f1; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .video-category { font-size: 0.85rem; color: #ff4d4d; font-weight: bold; margin-bottom: 15px; }

        .watch-btn { display: block; width: 100%; text-align: center; background: #ff0000; color: #fff; text-decoration: none; padding: 10px; border-radius: 5px; font-weight: bold; transition: background 0.2s; }
        .watch-btn:hover { background: #cc0000; }
    </style>
</head>
<body>

    <header>
        <h1>ফ্রি ভিডিও হাব</h1>
        <p>কোনো লগইন ছাড়াই হিন্দি, ইংলিশ, তামিল সিনেমা, ভিডিও গান এবং নাটক দেখুন</p>
    </header>

    <main class="video-grid" id="grid"></main>

    <script>
        // id = ইউটিউব ভিডিওর আইডি (লিংকের v= এর পরের অংশ)। ফাঁকা থাকলে সার্চে যাবে।
        const videos = [
            { id: "", title: "AVENGERS: ENDGAME - Official Movie Clip", category: "সিনেমা" },
            { id: "", title: "JAWAN - Shah Rukh Khan | Blockbuster Full Action Scene", category: "সিনেমা" },
            { id: "", title: "KGF: CHAPTER 2 - Yash | Superhit South Action Movie", category: "সিনেমা" },
            { id: "", title: "ব্যাচেলর পয়েন্ট | সিজন ৪ | পর্ব ০১", category: "নাটক" },
            { id: "", title: "Arabic Kuthu Video Song - Beast | Vijay & Pooja Hegde", category: "গান" }
        ];

        const grid = document.getElementById("grid");

        videos.forEach(v => {
            const link = v.id
                ? `https://www.youtube.com/watch?v=${v.id}`
                : `https://www.youtube.com/results?search_query=${encodeURIComponent(v.title)}`;
            const thumb = v.id
                ? `<img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="${v.title}" loading="lazy">`
                : "";

            const card = document.createElement("div");
            card.className = "video-card";
            card.innerHTML = `
                <div class="thumbnail-container">${thumb}</div>
                <div class="video-info">
                    <div>
                        <div class="video-title">${v.title}</div>
                        <div class="video-category">ক্যাটাগরি: ${v.category}</div>
                    </div>
                    <a href="${link}" target="_blank" rel="noopener noreferrer" class="watch-btn">ভিডিও দেখুন</a>
                </div>`;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
