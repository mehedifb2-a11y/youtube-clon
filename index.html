<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>Habib Video Hub</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='12' width='60' height='40' rx='13' fill='%23e8001f'/%3E%3Cpath d='M26 24l16 8-16 8z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  [hidden] { display: none !important; }
  body { background: #0f0f0f; color: #fff; }
  a { color: inherit; }

  /* ---------- হেডার ---------- */
  header { position: sticky; top: 0; z-index: 20; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #0f0f0f; border-bottom: 1px solid #272727; }
  #menu { flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; color: #fff; cursor: pointer; display: grid; place-items: center; }
  #menu:hover { background: #272727; }
  .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; flex: none; }
  .logo svg { display: block; filter: drop-shadow(0 2px 6px rgba(232,0,31,.45)); }
  .wm { font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; line-height: 1; display: flex; flex-direction: column; }
  .wm small { font-size: .5rem; font-weight: 600; letter-spacing: 2.2px; color: #aaa; text-transform: uppercase; margin-top: 3px; }
  #sf { flex: 1; display: flex; max-width: 640px; margin: 0 auto; min-width: 0; }
  #q { flex: 1; min-width: 0; padding: 9px 16px; border: 1px solid #303030; border-right: 0; background: #121212; color: #fff; border-radius: 22px 0 0 22px; outline: none; font-size: 1rem; }
  #q:focus { border-color: #1c62b9; }
  #sb { width: 60px; background: #222; border: 1px solid #303030; color: #fff; border-radius: 0 22px 22px 0; cursor: pointer; font-size: 1.05rem; }
  #sb:hover { background: #303030; }

  /* ---------- বাম সাইডবার ---------- */
  .sidebar { position: fixed; top: 56px; left: 0; bottom: 0; width: 240px; background: #0f0f0f; border-right: 1px solid #1f1f1f; overflow-y: auto; padding: 12px 10px 30px; z-index: 30; transform: translateX(-100%); transition: transform .22s ease; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  body.sbshow .sidebar { transform: none; }
  .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 25; }
  body.sbshow .backdrop { display: block; }
  .sgroup { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #272727; }
  .sgroup:last-child { border-bottom: 0; }
  .sgroup h4 { font-size: .75rem; color: #888; letter-spacing: .5px; padding: 8px 12px 6px; font-weight: 600; }
  .sitem { width: 100%; display: flex; align-items: center; gap: 14px; padding: 9px 12px; border: 0; border-radius: 10px; background: transparent; color: #fff; cursor: pointer; font-size: .93rem; text-align: left; }
  .sitem:hover { background: #272727; }
  .sitem.active { background: #2e2e2e; font-weight: 700; box-shadow: inset 3px 0 0 #e8001f; }
  .sitem .ic { width: 24px; text-align: center; font-size: 1.2rem; flex: none; }
  .sitem .nm { flex: 1; min-width: 0; line-height: 1.25; }
  .sitem .cnt { font-size: .7rem; color: #999; background: #1c1c1c; border-radius: 10px; padding: 2px 7px; flex: none; }
  .sitem.active .cnt { background: #444; color: #fff; }

  /* ---------- হোম ---------- */
  .page { padding: 16px; transition: margin-left .22s ease; }
  #upd { max-width: 1400px; margin: 0 auto 14px; color: #888; font-size: .8rem; }
  #heading { max-width: 1400px; margin: 0 auto 14px; font-size: 1.15rem; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px 16px; max-width: 1400px; margin: 0 auto; }
  .card { cursor: pointer; }
  .thumb { position: relative; aspect-ratio: 16/9; background: #1a1a1a; border-radius: 12px; overflow: hidden; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .2s; }
  .card:hover .thumb img { transform: scale(1.04); }
  .dur { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.85); padding: 2px 6px; border-radius: 4px; font-size: .75rem; font-weight: 600; }
  .info { padding: 10px 2px 0; }
  .title { font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ch { color: #aaa; font-size: .82rem; margin-top: 5px; }
  #status { text-align: center; color: #aaa; margin: 20px; }
  .btn { display: block; margin: 22px auto; background: #272727; color: #fff; border: 1px solid #444; padding: 12px 30px; border-radius: 25px; cursor: pointer; }
  .btn:hover { background: #333; }

  @media (min-width: 1001px) {
    body.sbshow:not(.watching) .page { margin-left: 240px; }
    body.sbshow:not(.watching) .backdrop { display: none; }
  }
  @media (max-width: 1000px) {
    .sidebar { top: 0; padding-top: 14px; z-index: 40; width: 270px; }
    .backdrop { z-index: 35; }
  }

  /* ---------- প্লে পেজ ---------- */
  .watch { display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-areas: "player related" "meta related"; grid-template-rows: auto 1fr; gap: 16px 24px; max-width: 1700px; margin: 0 auto; padding: 20px; }
  .pwrap { grid-area: player; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; width: 100%; }
  .pwrap iframe { width: 100%; height: 100%; border: 0; display: block; }
  .meta { grid-area: meta; }
  .meta h2 { font-size: 1.25rem; line-height: 1.4; }
  .meta .sub { color: #aaa; margin-top: 8px; font-size: .9rem; }
  .meta .yl { display: inline-block; margin-top: 12px; background: #272727; padding: 8px 16px; border-radius: 18px; text-decoration: none; font-size: .88rem; }
  .meta .yl:hover { background: #3a3a3a; }
  .related { grid-area: related; display: flex; flex-direction: column; gap: 12px; }
  .related h3 { font-size: 1rem; color: #ddd; }
  .rcard { display: flex; gap: 10px; cursor: pointer; }
  .rcard .thumb { width: 168px; flex: none; border-radius: 8px; }
  .rcard .info { padding: 0; min-width: 0; }
  .rcard .title { font-size: .92rem; }

  @media (max-width: 1000px) {
    .watch { grid-template-columns: minmax(0, 1fr); grid-template-areas: "player" "meta" "related"; grid-template-rows: auto; padding: 0 0 24px; gap: 14px; }
    .pwrap { position: sticky; top: 0; z-index: 15; border-radius: 0; }
    .meta, .related { padding: 0 12px; }
  }
  @media (max-width: 700px) {
    body.watching header { position: static; }
    header { padding: 0 8px; gap: 6px; }
    .wm { font-size: 1.25rem; }
    .wm small { display: none; }
    #sb { width: 46px; }
    .page { padding: 12px; }
    .grid { grid-template-columns: 1fr; gap: 20px; }
    .rcard { flex-direction: column; gap: 0; }
    .rcard .thumb { width: 100%; border-radius: 12px; }
    .rcard .info { padding: 8px 2px 0; }
    .rcard .title { font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <button id="menu" aria-label="মেনু">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
  </button>
  <a class="logo" href="#" id="logo" aria-label="Habib হোম">
    <svg viewBox="0 0 48 34" width="42" height="30" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3b3b"/><stop offset="1" stop-color="#c4001d"/></linearGradient></defs>
      <rect width="48" height="34" rx="10" fill="url(#lg)"/>
      <path d="M19 9v16l14-8z" fill="#fff"/>
    </svg>
    <span class="wm">Habib<small>Video Hub</small></span>
  </a>
  <form id="sf" autocomplete="off">
    <input id="q" type="search" placeholder="YouTube থেকে খুঁজুন..." enterkeyhint="search">
    <button id="sb" type="submit" aria-label="খুঁজুন">🔍</button>
  </form>
</header>

<nav class="sidebar" id="sidebar" aria-label="ক্যাটাগরি"></nav>
<div class="backdrop" id="backdrop"></div>

<!-- হোম -->
<div id="home" class="page">
  <div id="upd">লোড হচ্ছে...</div>
  <div id="heading" hidden></div>
  <main class="grid" id="grid"></main>
  <div id="status"></div>
  <button class="btn" id="more" hidden>আরও দেখুন</button>
</div>

<!-- প্লে পেজ -->
<div id="watch" class="watch" hidden>
  <div class="pwrap">
    <iframe id="player" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
  </div>
  <div class="meta">
    <h2 id="wt"></h2>
    <div class="sub" id="ws"></div>
    <a class="yl" id="wl" target="_blank" rel="noopener noreferrer">YouTube-এ খুলুন</a>
  </div>
  <aside class="related"><h3>সম্পর্কিত ভিডিও</h3><div id="rel" style="display:flex;flex-direction:column;gap:12px"></div></aside>
</div>

<script>
const API_KEY = "AIzaSyDINOtzZgA0UjnkVeSowUutcI2OC9Sjc_0";   // এখানে নতুন YouTube API Key বসান
const REFRESH_MIN = 40;           // কত মিনিট পর পর নতুন ভিডিও আনবে
const KEEP_DAYS = 60;             // ৬০ দিন পর অটো ডিলিট
const MAX_PER_CAT = 1500;         // প্রতি ক্যাটাগরিতে সর্বোচ্চ ভিডিও
const PAGE = 24;

// grp = সাইডবারে কোন গ্রুপে দেখাবে, ic = আইকন
const CATS = [
  { key: "hindi",    grp: "সিনেমা",         ic: "🎬", name: "হিন্দি সিনেমা",            long: true,  minSec: 2400, queries: ["hindi full movie", "bollywood full movie hd"] },
  { key: "english",  grp: "সিনেমা",         ic: "🍿", name: "ইংলিশ সিনেমা",            long: true,  minSec: 2400, queries: ["english full movie", "hollywood full movie hd"] },
  { key: "tamil",    grp: "সিনেমা",         ic: "🎞️", name: "তামিল সিনেমা",            long: true,  minSec: 2400, queries: ["tamil full movie", "tamil movie hd"] },
  { key: "bnmovie",  grp: "সিনেমা",         ic: "🎥", name: "বাংলা সিনেমা",            long: true,  minSec: 2400, queries: ["bangla full movie", "bengali movie hd"] },
  { key: "tamildub", grp: "ডাবিং",          ic: "🗣️", name: "তামিল বাংলা ডাবিং",       long: true,  minSec: 2400, queries: ["tamil movie bangla dubbed full movie", "south indian bangla dubbed movie"] },
  { key: "otherdub", grp: "ডাবিং",          ic: "🌐", name: "হিন্দি/ইংলিশ বাংলা ডাবিং", long: true,  minSec: 2400, queries: ["hindi movie bangla dubbed full movie", "hollywood bangla dubbed full movie"] },
  { key: "tamilhi",  grp: "ডাবিং",          ic: "💥", name: "তামিল হিন্দি ডাবিং",      long: true,  minSec: 2400, queries: ["tamil movie hindi dubbed full movie", "south tamil action hindi dubbed movie"] },
  { key: "telugu",   grp: "ডাবিং",          ic: "🔥", name: "তেলেগু হিন্দি ডাবিং",     long: true,  minSec: 2400, queries: ["telugu movie hindi dubbed full movie", "telugu action hindi dubbed movie"] },
  { key: "natok",    grp: "নাটক ও গান",     ic: "📺", name: "বাংলা নাটক",              long: false, minSec: 600,  queries: ["bangla natok", "bangla new natok 2026"] },
  { key: "gopal",    grp: "নাটক ও গান",     ic: "😂", name: "গোপালভাঁড়",              long: false, minSec: 300,  queries: ["gopal bhar bangla", "গোপাল ভাঁড়"] },
  { key: "song",     grp: "নাটক ও গান",     ic: "🎵", name: "ভিডিও গান",               long: false, minSec: 90,   queries: ["official video song", "new bangla song"] },
  { key: "lofi",     grp: "নাটক ও গান",     ic: "🎧", name: "Lo-Fi গান",               long: false, minSec: 120,  queries: ["bangla lofi song", "bengali lofi mashup", "বাংলা লোফি গান", "bangla lofi slowed reverb"] },
  { key: "found",    grp: null,             ic: "🔎", name: "সার্চ রেজাল্ট",            long: false, minSec: 0,    queries: [] }
];

const DAY = 864e5;
const $ = id => document.getElementById(id);
const grid = $("grid"), more = $("more"), statusEl = $("status");
const isDesktop = () => window.innerWidth > 1000;

// ---------- ক্যাশ (localStorage) ----------
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
function saveStore(key, arr) {
  for (let i = 0; i < 4; i++) {
    if (lsSet("vh_" + key, arr)) return;
    arr = arr.slice(0, Math.floor(arr.length / 2));
  }
}
const store = {};
CATS.forEach(c => store[c.key] = lsGet("vh_" + c.key, []));
const meta = lsGet("vh_meta", { last: 0, rr: 0, block: 0 });
const saveMeta = () => lsSet("vh_meta", meta);
let sq = lsGet("vh_sq", {});

// ---------- YouTube API ----------
const decode = s => { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; };
const toSec = iso => {
  const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(iso || "") || [];
  return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
};
async function yt(path, params) {
  const u = new URL("https://www.googleapis.com/youtube/v3/" + path);
  for (const [k, v] of Object.entries({ ...params, key: API_KEY })) u.searchParams.set(k, v);
  const j = await (await fetch(u)).json();
  if (j.error) { const e = new Error(j.error.message); e.quota = /quota/i.test(j.error.message); throw e; }
  return j;
}
async function searchItems(p) {
  const j = await yt("search", { part: "snippet", type: "video", maxResults: 50, videoEmbeddable: "true", safeSearch: "moderate", ...p });
  const items = j.items.map(it => ({ id: it.id.videoId, t: decode(it.snippet.title),
                                     c: decode(it.snippet.channelTitle), p: it.snippet.publishedAt }));
  const det = {};
  if (items.length) {
    const d = await yt("videos", { part: "contentDetails,status", id: items.map(v => v.id).join(","), maxResults: 50 });
    d.items.forEach(v => { if (v.status?.embeddable) det[v.id] = toSec(v.contentDetails.duration); });
  }
  return { items, det };
}
function mergeInto(key, items, det, minSec) {
  const now = Date.now();
  const map = new Map(store[key].map(v => [v.id, v]));
  let added = 0;
  items.forEach(v => {
    if (det[v.id] == null || det[v.id] < minSec) return;
    if (!map.has(v.id)) added++;
    map.set(v.id, { id: v.id, t: v.t, c: v.c, p: v.p, d: det[v.id], f: now });
  });
  store[key] = [...map.values()]
    .filter(v => now - v.f < KEEP_DAYS * DAY)
    .sort((a, b) => b.p.localeCompare(a.p))
    .slice(0, MAX_PER_CAT);
  saveStore(key, store[key]);
  return added;
}
async function fetchInto(cat, q) {
  const p = { q, order: "date" };
  if (cat.long) p.videoDuration = "long";
  const { items, det } = await searchItems(p);
  return mergeInto(cat.key, items, det, cat.minSec);
}

// ---------- অটো আপডেট ----------
let busy = false;
async function safely(fn) {
  if (busy) return;
  if (API_KEY === "YOUR_API_KEY") { statusEl.textContent = "কোডে আপনার YouTube API Key বসান।"; return; }
  if (Date.now() < meta.block) return;
  busy = true;
  try { await fn(); }
  catch (e) {
    if (e.quota) { meta.block = Date.now() + 3600e3; saveMeta(); statusEl.textContent = "আজকের API কোটা শেষ। ক্যাশ থেকে ভিডিও দেখানো হচ্ছে।"; }
    else statusEl.textContent = "API সমস্যা: " + e.message;
  }
  busy = false;
  rebuild(); refreshHome(); showUpdated();
}
async function fillEmpty() {
  for (const c of CATS) {
    if (!c.queries.length || store[c.key].length) continue;
    statusEl.textContent = `${c.name} লোড হচ্ছে...`;
    await fetchInto(c, c.queries[0]);
    meta.last = Date.now(); saveMeta();
    rebuild(); refreshHome();
  }
  statusEl.textContent = "";
}
async function refreshNext() {
  const real = CATS.filter(c => c.queries.length);
  const c = real[meta.rr % real.length];
  const q = c.queries[Math.floor(meta.rr / real.length) % c.queries.length];
  meta.rr++;
  await fetchInto(c, q);
  meta.last = Date.now(); saveMeta();
}
function tick() {
  const needFill = CATS.some(c => c.queries.length && !store[c.key].length);
  if (needFill) safely(fillEmpty);
  else if (Date.now() - meta.last >= REFRESH_MIN * 60000) safely(refreshNext);
  showUpdated();
}

// ---------- ডেটা ----------
let all = [], byId = new Map(), view = [], shown = 0, cat = "all", mode = "home", curQ = "";
const fmt = s => {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0");
};
function rebuild() {
  byId = new Map(); all = [];
  CATS.forEach(c => store[c.key].forEach(v => {
    if (byId.has(v.id)) return;
    const o = { ...v, k: c.key };
    byId.set(v.id, o); all.push(o);
  }));
  all.sort((a, b) => b.p.localeCompare(a.p));
  updateCounts();
}
function showUpdated() {
  const mins = meta.last ? Math.round((Date.now() - meta.last) / 60000) : null;
  $("upd").textContent = `${all.length} টি ভিডিও` + (mins == null ? "" : ` • শেষ আপডেট ${mins} মিনিট আগে`);
}

// ---------- সাইডবার ----------
const sidebar = $("sidebar");
function addItem(parent, key, ic, name) {
  const b = document.createElement("button");
  b.className = "sitem" + (key === "all" ? " active" : ""); b.dataset.k = key;
  b.innerHTML = `<span class="ic">${ic}</span><span class="nm"></span><span class="cnt"></span>`;
  b.querySelector(".nm").textContent = name;
  b.onclick = () => { goHome(true); setCat(key); closeSbIfOverlay(); window.scrollTo(0, 0); };
  parent.appendChild(b);
}
(function buildSidebar() {
  const g0 = document.createElement("div"); g0.className = "sgroup";
  addItem(g0, "all", "🏠", "হোম (সব ভিডিও)");
  sidebar.appendChild(g0);
  const groups = [];
  CATS.filter(c => c.grp).forEach(c => { if (!groups.includes(c.grp)) groups.push(c.grp); });
  groups.forEach(gn => {
    const g = document.createElement("div"); g.className = "sgroup";
    const h = document.createElement("h4"); h.textContent = gn; g.appendChild(h);
    CATS.filter(c => c.grp === gn).forEach(c => addItem(g, c.key, c.ic, c.name));
    sidebar.appendChild(g);
  });
})();
function updateCounts() {
  document.querySelectorAll(".sitem").forEach(b => {
    const k = b.dataset.k;
    const n = k === "all" ? all.length : (store[k] ? store[k].length : 0);
    b.querySelector(".cnt").textContent = n ? n : "";
  });
}
function setSb(on) { document.body.classList.toggle("sbshow", on); }
function closeSbIfOverlay() { if (!isDesktop() || document.body.classList.contains("watching")) setSb(false); }
$("menu").onclick = () => setSb(!document.body.classList.contains("sbshow"));
$("backdrop").onclick = () => setSb(false);

// ---------- হোম ইউআই ----------
function makeCard(v, cls) {
  const card = document.createElement("div"); card.className = cls;
  const th = document.createElement("div"); th.className = "thumb";
  const img = document.createElement("img");
  img.src = `https://img.youtube.com/vi/${v.id}/mqdefault.jpg`; img.alt = v.t; img.loading = "lazy";
  const d = document.createElement("span"); d.className = "dur"; d.textContent = fmt(v.d);
  th.append(img, d);
  const info = document.createElement("div"); info.className = "info";
  const t = document.createElement("div"); t.className = "title"; t.textContent = v.t;
  const c = document.createElement("div"); c.className = "ch"; c.textContent = v.c;
  info.append(t, c); card.append(th, info);
  card.onclick = () => openWatch(v.id, true);
  return card;
}
function refreshHome() {
  if (mode === "home") {
    view = all.filter(v => cat === "all" || v.k === cat);
    const h = $("heading");
    if (cat === "all") h.hidden = true;
    else { h.hidden = false; h.textContent = (CATS.find(c => c.key === cat) || {}).name || ""; }
    grid.innerHTML = ""; shown = 0;
    render();
  }
}
function render() {
  view.slice(shown, shown + PAGE).forEach(v => grid.appendChild(makeCard(v, "card")));
  shown += PAGE;
  more.hidden = shown >= view.length;
}
more.onclick = render;
function setCat(k) {
  cat = k; mode = "home"; statusEl.textContent = "";
  document.querySelectorAll(".sitem").forEach(t => t.classList.toggle("active", t.dataset.k === k));
  refreshHome();
}

// ---------- YouTube সার্চ ----------
async function liveSearch(q) {
  const key = q.toLowerCase();
  const c = sq[key];
  if (c && Date.now() - c.t < 6 * 3600e3) {
    const r = c.ids.map(i => byId.get(i)).filter(Boolean);
    if (r.length) return r;
  }
  const { items, det } = await searchItems({ q, order: "relevance" });
  mergeInto("found", items, det, 0);
  rebuild();
  const r = items.map(v => byId.get(v.id)).filter(Boolean);
  sq[key] = { t: Date.now(), ids: r.map(v => v.id) };
  Object.keys(sq).sort((a, b) => sq[b].t - sq[a].t).slice(15).forEach(k => delete sq[k]);
  lsSet("vh_sq", sq);
  return r;
}
function localSearch(q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  return all.filter(v => { const s = (v.t + " " + v.c).toLowerCase(); return terms.every(t => s.includes(t)); });
}
async function doSearch(q) {
  goHome(true);
  mode = "search"; curQ = q;
  document.querySelectorAll(".sitem").forEach(t => t.classList.remove("active"));
  grid.innerHTML = ""; more.hidden = true;
  const h = $("heading"); h.hidden = false; h.textContent = `“${q}” এর ফলাফল`;
  statusEl.textContent = "YouTube থেকে খোঁজা হচ্ছে...";
  let res = [], note = "";
  if (API_KEY === "YOUR_API_KEY") { res = localSearch(q); note = "API Key বসানো হয়নি, ক্যাশ থেকে খোঁজা হয়েছে।"; }
  else if (Date.now() < meta.block) { res = localSearch(q); note = "API কোটা শেষ, ক্যাশ থেকে খোঁজা হয়েছে।"; }
  else {
    try { res = await liveSearch(q); }
    catch (e) {
      if (e.quota) { meta.block = Date.now() + 3600e3; saveMeta(); note = "API কোটা শেষ, ক্যাশ থেকে খোঁজা হয়েছে।"; }
      else note = "API সমস্যা: " + e.message;
      res = localSearch(q);
    }
  }
  if (mode !== "search" || curQ !== q) return;
  view = res; shown = 0; grid.innerHTML = ""; render();
  statusEl.textContent = (res.length ? "" : "কোনো ভিডিও পাওয়া যায়নি। ") + note;
  showUpdated();
}
$("sf").addEventListener("submit", e => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (q) { doSearch(q); $("q").blur(); }
});

// ---------- প্লে পেজ ----------
const tokens = t => t.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w => w.length > 2);
function relatedOf(v) {
  const words = new Set(tokens(v.t));
  return all.filter(x => x.id !== v.id).map(x => {
    let s = 0;
    if (v.k && x.k === v.k) s += 5;
    if (v.c && x.c === v.c) s += 3;
    tokens(x.t).forEach(w => { if (words.has(w)) s++; });
    return { x, s };
  }).sort((a, b) => b.s - a.s || b.x.p.localeCompare(a.x.p)).slice(0, 30).map(o => o.x);
}
function openWatch(id, push) {
  const v = byId.get(id) || { id, t: "ভিডিও", c: "", p: "", d: 0, k: null };
  $("home").hidden = true; $("watch").hidden = false;
  document.body.classList.add("watching"); setSb(false);
  $("player").src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&playsinline=1`;
  $("wt").textContent = v.t;
  const bits = [];
  if (v.c) bits.push(v.c);
  if (v.p) bits.push(new Date(v.p).toLocaleDateString("bn-BD"));
  if (v.d) bits.push(fmt(v.d));
  $("ws").textContent = bits.join(" • ");
  $("wl").href = "https://www.youtube.com/watch?v=" + id;
  const rel = $("rel"); rel.innerHTML = "";
  relatedOf(v).forEach(x => rel.appendChild(makeCard(x, "rcard")));
  document.title = v.t + " - Habib";
  if (push) history.pushState({ id }, "", "#v=" + id);
  window.scrollTo(0, 0);
}
function showHomeUI() {
  $("player").src = "";
  $("watch").hidden = true; $("home").hidden = false;
  document.body.classList.remove("watching");
  setSb(isDesktop());
  document.title = "Habib Video Hub";
}
function goHome(push) {
  const wasWatching = !$("watch").hidden;
  showHomeUI();
  if (wasWatching && push && location.hash) history.pushState({}, "", location.pathname + location.search);
}
$("logo").onclick = e => {
  e.preventDefault(); $("q").value = "";
  goHome(true); setCat("all"); window.scrollTo(0, 0);
};
window.addEventListener("popstate", () => {
  const m = /^#v=([\w-]{6,})/.exec(location.hash);
  if (m) openWatch(m[1], false); else showHomeUI();
});

// ---------- শুরু ----------
setSb(isDesktop());
rebuild(); refreshHome(); showUpdated();
(() => { const m = /^#v=([\w-]{6,})/.exec(location.hash); if (m) openWatch(m[1], false); })();
tick();
setInterval(tick, 60000);
</script>
