<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফ্রি এন্টারটেইনমেন্ট হাব</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f0f0f; color: #fff; padding: 20px; }
        header { text-align: center; margin-bottom: 40px; padding: 20px; border-bottom: 1px solid #2f2f2f; }
        header h1 { color: #ff0000; font-size: 2.5rem; margin-bottom: 10px; }
        header p { color: #aaa; }
        
        /* Category Tabs */
        .category-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .category-btn { background: #2f2f2f; color: #fff; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 1rem; transition: background 0.3s; }
        .category-btn.active, .category-btn:hover { background: #ff0000; }

        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .video-card { background: #1f1f1f; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.2s; }
        .video-card:hover { transform: translateY(-5px); }
        .thumbnail-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
        .thumbnail-container img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .video-info { padding: 15px; }
        .video-title { font-size: 1.1rem; font-weight: bold; line-height: 1.4; margin-bottom: 8px; color: #f1f1f1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .video-category { font-size: 0.85rem; color: #ff0000; font-weight: bold; text-transform: uppercase; }
        
        /* Modal for Player */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .modal-content { width: 90%; max-width: 800px; aspect-ratio: 16/9; background: #000; position: relative; }
        .modal-content iframe { width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: -40px; right: 0; color: #fff; font-size: 30px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>ফ্রি ভিডিও হাব</h1>
        <p>কোনো লগইন ছাড়াই সুপার ফাস্ট স্পিডে নাটক, হিন্দি/ইংলিশ/তামিল সিনেমা এবং ভিডিও গান দেখুন</p>
    </header>

    <!-- ক্যাটাগরি ফিল্টার বাটনসমূহ -->
    <div class="category-container">
        <button class="category-btn active" onclick="filterVideos('all', event)">সব ভিডিও</button>
        <button class="category-btn" onclick="filterVideos('natok', event)">নাটক</button>
        <button class="category-btn" onclick="filterVideos('hindi', event)">হিন্দি সিনেমা</button>
        <button class="category-btn" onclick="filterVideos('english', event)">ইংলিশ সিনেমা</button>
        <button class="category-btn" onclick="filterVideos('tamil', event)">তামিল সিনেমা</button>
        <button class="category-btn" onclick="filterVideos('song', event)">ভিডিও গান</button>
    </div>

    <main class="video-grid" id="videoGrid">
        <!-- ভিডিওগুলো এখানে লোড হবে -->
    </main>

    <!-- ভিডিও প্লেয়ার মোডাল -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <span class="close-btn" id="closeBtn">&times;</span>
            <div id="playerContainer" style="width:100%; height:100%;"></div>
        </div>
    </div>

    <script>
        // আপনার পছন্দের ভিডিওগুলোর আইডি দিয়ে সাজানো সম্পূর্ণ নতুন লিস্ট
        const videoData = [
            // === নাটক (natok) ===
            { id: "M5uInwX8W0M", title: "Bachelor Point | Season 4 | Episode 01", category: "natok" },
            { id: "f48_TIn6U60", title: "Female 4 | ফিমেল ৪ | bangla natok 2024", category: "natok" },
            
            // === হিন্দি সিনেমা (hindi) ===
            { id: "Q_H7-F4H6Ew", title: "Jawan Full Movie (Hindi) | Shah Rukh Khan", category: "hindi" },
            { id: "YxW7bYv_P8w", title: "Pathaan Action Movie Compilation", category: "hindi" },
            
            // === ইংলিশ সিনেমা (english) ===
            { id: "dQw4w9WgXcQ", title: "Top Action Hollywood Movie Scene HD", category: "english" },
            { id: "6_p_C_pGfFk", title: "Avatar 2 Official Trailer & Scenes", category: "english" },
            
            // === তামিল সিনেমা (tamil) ===
            { id: "a5S2AitwJ9Y", title: "Leo (Tamil) Official Action Scene | Vijay", category: "tamil" },
            { id: "M7lc1UVf-VE", title: "KGF Chapter 2 Blockbuster Movie Clips", category: "tamil" },
            
            // === ভিডিও গান (song) ===
            { id: "4vL64N0BwG0", title: "Arabic Kuthu - Video Song | Halamithi Habibo", category: "song" },
            { id: "fJ9rUzIMcZQ", title: "Calm Down - Rema & Selena Gomez Video Song", category: "song" }
        ];

        const videoGrid = document.getElementById('videoGrid');
        const videoModal = document.getElementById('videoModal');
        const playerContainer = document.getElementById('playerContainer');
        const closeBtn = document.getElementById('closeBtn');

        function displayVideos(videos) {
            videoGrid.innerHTML = videos.map(video => `
                <div class="video-card" onclick="playVideo('${video.id}')">
                    <div class="thumbnail-container">
                        <img src="https://youtube.com{video.id}/hqdefault.jpg" alt="${video.title}">
                    </div>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="video-category">${video.category.toUpperCase()}</div>
                    </div>
                </div>
            `).join('');
        }

        function filterVideos(category, event) {
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'all') {
                displayVideos(videoData);
            } else {
                const filtered = videoData.filter(v => v.category === category);
                displayVideos(filtered);
            }
        }

        function playVideo(videoId) {
            playerContainer.innerHTML = `<iframe src="https://youtube.com{videoId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            videoModal.style.display = 'flex';
        }

        closeBtn.onclick = function() {
            videoModal.style.display = 'none';
            playerContainer.innerHTML = '';
        }

        window.onclick = function(event) {
            if (event.target == videoModal) {
                videoModal.style.display = 'none';
                playerContainer.innerHTML = '';
            }
        }

        // প্রথমবার পেজ লোড হলে সব ভিডিও দেখাবে
        displayVideos(videoData);
    </script>
</body>
</html>
