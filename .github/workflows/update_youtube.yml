name: Update Videos

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: update-videos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: পুরনো ক্যাশ নামানো
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site \
            || mkdir site

      - name: নতুন ভিডিও আনা ও ৬০ দিনের পুরনো মোছা
        run: node scripts/update.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      - name: ওয়েবসাইট পাবলিশ (হিস্ট্রি ছাড়া)
        run: |
          cp index.html site/index.html
          touch site/.nojekyll
          cd site
          rm -rf .git
          git init -b gh-pages
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add -A
          git commit -m "update $(date -u +%F-%H%M)"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
